# Judge model: openai/gpt-oss-120b via NVIDIA API
# Alternative judge for omniscience benchmark evaluation.
# Requires NVIDIA_API_KEY in the environment.
# Sets use_chat_completions_for_judge since NVIDIA API only supports /v1/chat/completions.
genrm_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://integrate.api.nvidia.com/v1
      openai_api_key: ${oc.env:NVIDIA_API_KEY}
      openai_model: openai/gpt-oss-120b

omniscience_omniscience_resources_server_nvidia_judge:
  _inherit_from: omniscience_omniscience_resources_server
  resources_servers:
    omniscience:
      use_chat_completions_for_judge: true
